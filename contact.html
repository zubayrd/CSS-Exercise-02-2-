<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Lumina</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="bg-light font-monospace d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Lumina</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavMenu"
          aria-controls="navbarNavMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNavMenu">
          <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="products.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active fw-bold" aria-current="page" href="contact.html">Contact</a>
              </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container my-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-lg-7 animate__animated animate__fadeInUp">
          <div class="text-center mb-4">
            <h1 class="fw-bold">Contact Us</h1>
            <p class="text-muted">Have a question about a product or want to leave a review? Send us a message below.</p>
          </div>


          <div class="card shadow-sm">
            <div class="card-body p-4">
              <form>
                <div class="mb-3">
                  <label for="fullName" class="form-label fw-semibold">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="emailAddress" class="form-label fw-semibold">Email Address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="emailAddress"
                    placeholder="name@example.com"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="subjectSelect" class="form-label fw-semibold">Subject</label>
                  <select class="form-select" id="subjectSelect">
                    <option selected>General Inquiry</option>
                    <option value="1">Product Question</option>
                    <option value="2">Order &amp; Shipping</option>
                    <option value="3">Leave a Review</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="messageBox" class="form-label fw-semibold">Message</label>
                  <textarea
                    class="form-control"
                    id="messageBox"
                    rows="5"
                    placeholder="Write your message here..."
                    required
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                  Send Email
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-primary text-white text-center mt-auto py-4">
      <div class="container">
        <p class="mb-0">&copy; 2026 Lumina. All rights reserved.</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
